<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenhos</title>
</head>

<style>
       .img-pequena {
            width: 30%;
            height: 300px;
            object-fit: cover;
        }

        img {
            border-radius: 10px;
        }

        .img-destaque {
            height: 800px;
            width: 100%;
            object-fit: cover;
        }
        .div-imagens {
            margin-top: 20px;
            border: 5px solid rgb(0, 255, 238);
            background-color: rgb(82, 15, 15);
            display: flex;
            justify-content: space-between;
        }

</style>

<body>
    <div>
        <img class="img-destaque" src="Naruto.png" alt="Foto do Naruto">
    </div>
    
    <div class="div-imagens" >
        <img class="img-pequena" src="Spider man.jpg" alt="Foto do Spider man">
        <img class="img-pequena" src="Kung fu panda.jpg" alt="Foto do Kung fu panda">
        <img class="img-pequena" src="como-treinar-o-seu-dragao-3.jpg" alt="Foto do como treinar o seu dragão 3">
    </div>

    <style>
        .img-pequena {
            width: 30%;
            height: 200px;
            object-fit: cover;
        }

        img {
            border-radius: 10px;
        }

        .img-destaque {
            height: 500px;
            width: 100%;
            object-fit: cover;
        }

        img {
            border-radius: 50px;
            border: 10px dashed yellow;
        }

    </style>
    
</body>
</html>
