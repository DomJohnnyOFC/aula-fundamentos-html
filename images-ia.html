<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Galeria Animada | Desenhos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #0a0e1a, #020408);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            position: relative;
        }

        /* ===== PARTÍCULAS DE FUNDO ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, rgba(0, 255, 238, 0.25), transparent),
                radial-gradient(3px 3px at 80% 40%, rgba(255, 215, 0, 0.2), transparent),
                radial-gradient(2px 2px at 30% 70%, rgba(0, 200, 255, 0.2), transparent),
                radial-gradient(2px 2px at 90% 80%, rgba(255, 100, 200, 0.15), transparent),
                radial-gradient(3px 3px at 50% 90%, rgba(0, 255, 200, 0.2), transparent);
            background-size: 300px 300px;
            animation: floatParticles 60s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatParticles {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-80px, -60px) rotate(5deg); }
        }

        /* ===== TÍTULO ===== */
        .gallery-title {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #fff;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-shadow: 0 0 40px rgba(0, 255, 238, 0.15);
        }

        .gallery-title span {
            background: linear-gradient(135deg, #0ff, #7bf5ff, #f0f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        .gallery-title small {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.4;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 0.3rem;
            color: #8cf;
        }

        /* ===== IMAGEM DESTAQUE ===== */
        .destaque-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 0 2px rgba(0, 255, 238, 0.15),
                0 0 60px rgba(0, 255, 238, 0.08);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }

        .destaque-wrapper:hover {
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.9),
                0 0 0 3px rgba(0, 255, 238, 0.3),
                0 0 80px rgba(0, 255, 238, 0.15);
            transform: scale(1.01);
        }

        .img-destaque {
            width: 100%;
            height: 520px;
            object-fit: cover;
            display: block;
            transition: transform 0.8s ease;
            filter: saturate(1.05) contrast(1.02);
        }

        .destaque-wrapper:hover .img-destaque {
            transform: scale(1.03);
        }

        /* ===== BADGE SOBRE A IMAGEM ===== */
        .destaque-badge {
            position: absolute;
            bottom: 20px;
            left: 25px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 0.6rem 1.8rem;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .destaque-badge span {
            color: #0ff;
        }

        /* Ícone de play no destaque */
        .play-icon-destaque {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 255, 238, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 255, 238, 0.5);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 0 40px rgba(0, 255, 238, 0.2);
        }

        .destaque-wrapper:hover .play-icon-destaque {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-icon-destaque svg {
            width: 35px;
            height: 35px;
            fill: #fff;
            filter: drop-shadow(0 0 20px rgba(0, 255, 238, 0.5));
        }

        /* ===== GALERIA (container das imagens pequenas) ===== */
        .galeria-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            padding: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            transition: all 0.4s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .galeria-container:hover {
            border-color: rgba(0, 255, 238, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 255, 238, 0.03);
        }

        /* ===== CARD DAS IMAGENS PEQUENAS ===== */
        .img-card {
            flex: 1 1 200px;
            min-width: 160px;
            max-width: 320px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .img-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(0, 255, 238, 0.4);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(0, 255, 238, 0.08);
            z-index: 2;
        }

        .img-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.6) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .img-card:hover::after {
            opacity: 1;
        }

        .img-pequena {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
            filter: saturate(0.95) brightness(0.95);
        }

        .img-card:hover .img-pequena {
            transform: scale(1.08);
            filter: saturate(1.1) brightness(1.02);
        }

        /* ===== NOME DA IMAGEM (overlay) ===== */
        .img-label {
            position: absolute;
            bottom: 14px;
            left: 16px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            z-index: 2;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .img-card:hover .img-label {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== ÍCONE DE PLAY NOS CARDS ===== */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 238, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 255, 238, 0.3);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 255, 238, 0.1);
        }

        .img-card:hover .play-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-icon svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            filter: drop-shadow(0 0 15px rgba(0, 255, 238, 0.3));
        }

        /* ===== RODAPÉ ===== */
        .footer-gallery {
            position: relative;
            z-index: 1;
            margin-top: 0.5rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 1.5rem;
            width: 100%;
            max-width: 1100px;
            text-align: center;
        }

        .footer-gallery span {
            color: rgba(0, 255, 238, 0.3);
        }

        /* ===== TOOLTIP CLIQUE ===== */
        .click-hint {
            position: absolute;
            top: 10px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 2;
        }

        .img-card:hover .click-hint {
            opacity: 1;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .gallery-title {
                font-size: 2rem;
            }
            .img-destaque {
                height: 320px;
            }
            .destaque-badge {
                font-size: 0.6rem;
                padding: 0.4rem 1.2rem;
                bottom: 12px;
                left: 16px;
            }
            .play-icon-destaque {
                width: 60px;
                height: 60px;
            }
            .play-icon-destaque svg {
                width: 28px;
                height: 28px;
            }
            .galeria-container {
                padding: 1rem;
                gap: 1rem;
            }
            .img-card {
                flex: 1 1 140px;
                min-width: 120px;
            }
            .img-pequena {
                height: 160px;
            }
            .play-icon {
                width: 40px;
                height: 40px;
            }
            .play-icon svg {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 480px) {
            .gallery-title {
                font-size: 1.5rem;
            }
            .img-destaque {
                height: 220px;
            }
            .play-icon-destaque {
                width: 50px;
                height: 50px;
            }
            .play-icon-destaque svg {
                width: 22px;
                height: 22px;
            }
            .galeria-container {
                padding: 0.8rem;
                gap: 0.8rem;
            }
            .img-card {
                flex: 1 1 100px;
                min-width: 80px;
            }
            .img-pequena {
                height: 120px;
            }
            .img-label {
                font-size: 0.6rem;
                padding: 0.2rem 0.8rem;
                bottom: 8px;
                left: 10px;
            }
            .play-icon {
                width: 35px;
                height: 35px;
            }
            .play-icon svg {
                width: 15px;
                height: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TÍTULO ===== -->
    <h1 class="gallery-title">
        <span>✦ Galeria Animada</span>
        <small>Clique nas imagens • Assista aos vídeos</small>
    </h1>

    <!-- ===== IMAGEM DESTAQUE ===== -->
    <a href="https://youtu.be/2upuBiEiXDk?si=o6gJMwdGv1JpOSA9" target="_blank" class="destaque-wrapper">
        <img 
            class="img-destaque" 
            src="Naruto.png" 
            alt="Naruto - personagem principal"
            loading="lazy"
        >
        <div class="destaque-badge">
            ⚡ <span>Destaque</span> • Naruto
        </div>
        <div class="play-icon-destaque">
            <svg viewBox="0 0 24 24">
                <polygon points="5,3 19,12 5,21" />
            </svg>
        </div>
    </a>

    <!-- ===== GALERIA DE IMAGENS ===== -->
    <div class="galeria-container">
        
        <!-- Card 1 - Spider Man -->
        <a href="https://youtu.be/q0aaE6AxmFY?si=i99-FHHknqY2DcyR" target="_blank" class="img-card">
            <img 
                class="img-pequena" 
                src="Spider man.jpg" 
                alt="Spider Man - herói aracnídeo"
                loading="lazy"
            >
            <span class="img-label">🕷️ Spider-Man</span>
            <span class="click-hint">▶ Assistir</span>
            <div class="play-icon">
                <svg viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21" />
                </svg>
            </div>
        </a>

        <!-- Card 2 - Kung Fu Panda -->
        <a href="https://youtu.be/4MCOtam5pAg?si=ZmcK-yrdEJdWj2R5" target="_blank" class="img-card">
            <img 
                class="img-pequena" 
                src="Kung fu panda.jpg" 
                alt="Kung Fu Panda - Po"
                loading="lazy"
            >
            <span class="img-label">🐼 Kung Fu Panda</span>
            <span class="click-hint">▶ Assistir</span>
            <div class="play-icon">
                <svg viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21" />
                </svg>
            </div>
        </a>

        <!-- Card 3 - Como Treinar o Dragão -->
        <a href="https://youtu.be/kCqvWoeNaIg?si=jAnriYPWNvilvpLa" target="_blank" class="img-card">
            <img 
                class="img-pequena" 
                src="como-treinar-o-seu-dragao-3.jpg" 
                alt="Como Treinar o seu Dragão 3 - Soluço e Banguela"
                loading="lazy"
            >
            <span class="img-label">🐉 Como Treinar o Dragão</span>
            <span class="click-hint">▶ Assistir</span>
            <div class="play-icon">
                <svg viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21" />
                </svg>
            </div>
        </a>

    </div>

    <!-- ===== RODAPÉ ===== -->
    <div class="footer-gallery">
        <span>✦</span> 2026 • Clique e assista aos vídeos • 4K <span>✦</span>
    </div>

</body>
</html>
